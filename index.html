<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- META:START (auto-generated by `npm run meta` from config.js — safe to leave as is) -->
  <title>Alex Rivera — Portfolio</title>
  <meta name="description" content="Full-stack developer building fast, minimal and delightful web apps." />
  <meta name="theme-color" content="#f3f0e8" />
  <link rel="canonical" href="https://your-name.vercel.app" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-name.vercel.app" />
  <meta property="og:title" content="Alex Rivera — Portfolio" />
  <meta property="og:description" content="Full-stack developer building fast, minimal and delightful web apps." />
  <meta property="og:image" content="https://your-name.vercel.app/assets/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alex Rivera — Portfolio" />
  <meta name="twitter:description" content="Full-stack developer building fast, minimal and delightful web apps." />
  <meta name="twitter:image" content="https://your-name.vercel.app/assets/img/og-image.png" />
  <!-- META:END -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="bg-dim" id="bg-dim"></div>

  <div id="enter" class="enter" hidden>
    <div class="enter-inner">
      <p class="enter-kicker" id="enter-kicker"></p>
      <h2 class="enter-name" id="enter-name"></h2>
      <button id="enter-btn" class="enter-btn" type="button"></button>
      <button id="enter-silent" class="enter-link" type="button" hidden></button>
    </div>
  </div>

  <div class="top">
    <div id="lang" class="seg" role="group" aria-label="Language"></div>
    <button id="studio-btn" class="sq" type="button" aria-label="Theme" aria-expanded="false" hidden></button>
    <button id="mute" class="sq" type="button" aria-label="Sound" hidden></button>
  </div>

  <aside id="studio" class="studio" hidden aria-label="Theme studio"></aside>

  <main class="wrap">
    <header class="hero">
      <img id="avatar" class="avatar rise" style="--i:0" alt="" width="72" height="72" />
      <h1 id="name" class="hero-name rise" style="--i:1"></h1>
      <p id="tagline" class="hero-tagline rise" style="--i:2"></p>
      <p id="meta" class="hero-meta rise" style="--i:3"></p>
      <nav id="social" class="social rise" style="--i:4" aria-label="Links"></nav>
      <a class="scroll-hint rise" style="--i:5" href="#cards" id="scroll-hint"></a>
    </header>
    <div id="cards"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Please enable JavaScript to view this portfolio.</p></noscript>
  <script src="config.js"></script>
  <script src="assets/js/themes.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
